<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-label="Lago de datos: Trino y Hive consultan HDFS y MinIO; Hive Metastore guarda el catálogo en MySQL. YARN gestiona MapReduce."><title>Lago de datos: Trino y Hive consultan HDFS y MinIO; Hive Metastore guarda el catálogo en MySQL. YARN gestiona MapReduce.</title><defs><marker id="lake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708c93"/></marker></defs><g font-family="system-ui,sans-serif" fill="#19343d"><g><rect x="30" y="30" width="290" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="48" y="61" font-size="18" font-weight="700">Trino</text><text x="48" y="84" font-size="13" fill="#4c6268">SQL sobre HDFS, MinIO y MySQL</text><text x="48" y="102" font-size="13" fill="#4c6268">localhost:8080</text></g><g><rect x="380" y="30" width="290" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="398" y="61" font-size="18" font-weight="700">HiveServer2</text><text x="398" y="84" font-size="13" fill="#4c6268">SQL con Tez local en este servicio</text><text x="398" y="102" font-size="13" fill="#4c6268">JDBC :10000 · web :10002</text></g><g><rect x="730" y="30" width="280" height="86" rx="11" fill="#f0f1eb" stroke="#c0d0d1"/><text x="748" y="61" font-size="18" font-weight="700">Inicializadores</text><text x="748" y="84" font-size="13" fill="#4c6268">hdfs-init · minio-init · retail-init</text><text x="748" y="102" font-size="13" fill="#4c6268">Preparan los datos y terminan</text></g><g><rect x="380" y="188" width="290" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="398" y="219" font-size="18" font-weight="700">Hive Metastore</text><text x="398" y="242" font-size="13" fill="#4c6268">Catálogo compartido de tablas</text><text x="398" y="260" font-size="13" fill="#4c6268">Puerto interno :9083</text></g><g><rect x="730" y="188" width="280" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="748" y="219" font-size="18" font-weight="700">MySQL metastore</text><text x="748" y="242" font-size="13" fill="#4c6268">Guarda el catálogo de Hive</text><text x="748" y="260" font-size="13" fill="#4c6268">localhost:3306</text></g><path d="M 175 116 L 175 156 L 460 156 L 460 186" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#lake-arrow)" stroke-dasharray="5 5"/><text x="330" y="145" text-anchor="middle" font-size="12" fill="#52666d">metadatos</text><path d="M 525 116 L 525 186" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#lake-arrow)"/><path d="M 670 231 L 728 231" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#lake-arrow)"/><g><rect x="30" y="350" width="290" height="86" rx="11" fill="#f6eddb" stroke="#c0d0d1"/><text x="48" y="381" font-size="18" font-weight="700">HDFS</text><text x="48" y="404" font-size="13" fill="#4c6268">NameNode + DataNode (dnnm)</text><text x="48" y="422" font-size="13" fill="#4c6268">Archivos y bloques · web :9870</text></g><g><rect x="380" y="350" width="290" height="86" rx="11" fill="#f6eddb" stroke="#c0d0d1"/><text x="398" y="381" font-size="18" font-weight="700">MinIO</text><text x="398" y="404" font-size="13" fill="#4c6268">Almacenamiento de objetos S3</text><text x="398" y="422" font-size="13" fill="#4c6268">Consola :9001 · API :9000</text></g><g><rect x="730" y="350" width="280" height="86" rx="11" fill="#f6eddb" stroke="#c0d0d1"/><text x="748" y="381" font-size="18" font-weight="700">MySQL retail</text><text x="748" y="404" font-size="13" fill="#4c6268">Base de datos de ejemplo</text><text x="748" y="422" font-size="13" fill="#4c6268">localhost:3307</text></g><text x="30" y="320" font-size="14" fill="#52666d">Datos: Trino accede a las tres fuentes; Hive accede a HDFS y MinIO.</text><rect x="30" y="475" width="980" height="92" rx="10" fill="#e8f0ec"/><text x="50" y="505" font-size="17" font-weight="700">YARN: ResourceManager → NodeManager (dentro de dnnm)</text><text x="50" y="531" font-size="14">Programa trabajos MapReduce. Web :8088 y :8042. No ejecuta las consultas Hive de esta práctica.</text><text x="50" y="551" font-size="12">El cliente Hadoop/Jupyter (:8889) se añade con el perfil hadoop; no permanece activo con lake.</text></g></svg>