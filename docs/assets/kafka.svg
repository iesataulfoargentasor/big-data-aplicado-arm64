<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" aria-label="Kafka ARM64: tres brokers con rol de controller KRaft replican los mensajes; Kafka UI permite observar el clúster."><title>Kafka ARM64: tres brokers con rol de controller KRaft replican los mensajes; Kafka UI permite observar el clúster.</title><defs><marker id="kafka-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708c93"/></marker></defs><g font-family="system-ui,sans-serif" fill="#19343d"><g><rect x="30" y="190" width="210" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="48" y="221" font-size="18" font-weight="700">Productor</text><text x="48" y="244" font-size="13" fill="#4c6268">Publica mensajes</text><text x="48" y="262" font-size="13" fill="#4c6268">acks=all</text></g><g><rect x="800" y="190" width="210" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="818" y="221" font-size="18" font-weight="700">Consumidor</text><text x="818" y="244" font-size="13" fill="#4c6268">Lee los mensajes</text><text x="818" y="262" font-size="13" fill="#4c6268">desde otro broker</text></g><g><rect x="300" y="30" width="430" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="318" y="61" font-size="18" font-weight="700">Kafka UI</text><text x="318" y="84" font-size="13" fill="#4c6268">Consola del clúster · localhost:8083</text><text x="318" y="102" font-size="13" fill="#4c6268">Observa brokers, topics y mensajes</text></g><path d="M 515 116 L 515 170" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)" stroke-dasharray="5 5"/><text x="590" y="147" text-anchor="middle" font-size="12" fill="#52666d">observación</text><rect x="270" y="175" width="500" height="330" rx="14" fill="#f8faf8" stroke="#b8cbc8" stroke-dasharray="6 5"/><g><rect x="300" y="195" width="205" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="318" y="226" font-size="18" font-weight="700">Kafka 1</text><text x="318" y="249" font-size="13" fill="#4c6268">broker + controller</text><text x="318" y="267" font-size="13" fill="#4c6268">localhost:29092</text></g><g><rect x="535" y="195" width="205" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="553" y="226" font-size="18" font-weight="700">Kafka 2</text><text x="553" y="249" font-size="13" fill="#4c6268">broker + controller</text><text x="553" y="267" font-size="13" fill="#4c6268">localhost:39092</text></g><g><rect x="415" y="360" width="210" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="433" y="391" font-size="18" font-weight="700">Kafka 3</text><text x="433" y="414" font-size="13" fill="#4c6268">broker + controller</text><text x="433" y="432" font-size="13" fill="#4c6268">localhost:49092</text></g><path d="M 240 233 L 298 233" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)"/><path d="M 742 233 L 798 233" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)"/><path d="M 505 238 L 533 238" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)"/><path d="M 630 281 L 565 358" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)"/><path d="M 450 360 L 397 283" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#kafka-arrow)"/><text x="520" y="480" text-anchor="middle" font-size="13">Un volumen por broker · réplicas de los mensajes</text><text x="30" y="553" font-size="14" fill="#52666d">KRaft gestiona el consenso. No hay ZooKeeper. Los tres nodos viven en el mismo Mac.</text></g></svg>