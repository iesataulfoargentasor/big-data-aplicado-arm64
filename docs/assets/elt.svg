<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 555" role="img" aria-label="ELT: MySQL pasa por dlt a DuckDB y dbt crea los modelos. Airflow orquesta; PostgreSQL guarda su historial."><title>ELT: MySQL pasa por dlt a DuckDB y dbt crea los modelos. Airflow orquesta; PostgreSQL guarda su historial.</title><defs><marker id="elt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708c93"/></marker></defs><g font-family="system-ui,sans-serif" fill="#19343d"><g><rect x="30" y="30" width="290" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="48" y="61" font-size="18" font-weight="700">Airflow webserver</text><text x="48" y="84" font-size="13" fill="#4c6268">Interfaz para lanzar y ver el DAG</text><text x="48" y="102" font-size="13" fill="#4c6268">localhost:8082</text></g><g><rect x="380" y="30" width="290" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="398" y="61" font-size="18" font-weight="700">Airflow scheduler</text><text x="398" y="84" font-size="13" fill="#4c6268">LocalExecutor ejecuta las tareas</text><text x="398" y="102" font-size="13" fill="#4c6268">dlt → dbt run → dbt test</text></g><g><rect x="730" y="30" width="280" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="748" y="61" font-size="18" font-weight="700">PostgreSQL</text><text x="748" y="84" font-size="13" fill="#4c6268">Metadatos e historial de Airflow</text><text x="748" y="102" font-size="13" fill="#4c6268">Volumen persistente</text></g><path d="M 320 73 L 378 73" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#elt-arrow)"/><path d="M 670 73 L 728 73" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#elt-arrow)"/><rect x="270" y="183" width="750" height="160" rx="12" fill="#f8faf8" stroke="#b8cbc8" stroke-dasharray="6 5"/><text x="290" y="210" font-size="12" font-weight="700">DLT, DUCKDB Y DBT: DENTRO DE LAB O DE LAS TAREAS AIRFLOW</t